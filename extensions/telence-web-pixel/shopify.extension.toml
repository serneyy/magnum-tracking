type = "web_pixel_extension"
name = "Telence Web Pixel"
handle = "telence-web-pixel"
runtime_context = "strict"

# Shopify CLI adds/manages the extension UID when this extension is generated/deployed.

[customer_privacy]
analytics = true
marketing = true
preferences = false
sale_of_data = "enabled"

[settings]
type = "object"

[settings.fields.endpoint]
name = "Telence endpoint"
description = "HTTPS endpoint receiving Telence checkout events"
type = "single_line_text_field"
validations = [{ name = "min", value = "1" }]

[settings.fields.publicKey]
name = "Public pixel key"
description = "Per-store public ingestion key generated by Telence"
type = "single_line_text_field"
validations = [{ name = "min", value = "16" }]
